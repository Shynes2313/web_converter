<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video/Audio Converter</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); display: inline-block; }
        input, select, button { margin: 10px 0; padding: 10px; font-size: 16px; }
        button { background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Video & Audio upload</h2>
        <form action="/upload/" method="post" enctype="multipart/form-data">
            <input type="file" name="file" required><br>
            <label for="format">Convert to:</label>
            <select name="format" id="format">
                <option value="mp3">MP3</option>
                <option value="mp4">MP4</option>
                <option value="wav">WAV</option>
            </select><br>
            <button type="submit">Convert Now</button>
        </form>
    </div>
</body>
</html>
